version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: scalpai-postgres
    environment:
      POSTGRES_USER: scalpai
      POSTGRES_PASSWORD: scalpai_password
      POSTGRES_DB: scalpai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalpai -d scalpai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scalpai-network

  redis:
    image: redis:7-alpine
    container_name: scalpai-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scalpai-network

  backend:
    build: ./backend
    container_name: scalpai-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MTAPI_KEY=${MTAPI_KEY}
      - MTAPI_ACCOUNT_ID=${MTAPI_ACCOUNT_ID}
      - MTAPI_BASE_URL=https://api.metatraderapi.net
      - DATABASE_URL=postgresql+asyncpg://scalpai:scalpai_password@postgres:5432/scalpai_db
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - DEBUG=false
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - scalpai-network

volumes:
  postgres_data:
  redis_data:

networks:
  scalpai-network:
    driver: bridge
